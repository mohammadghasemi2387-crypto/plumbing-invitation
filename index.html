<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سمینار تخصصی تاسیسات - پورارجمند</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Variable-font-face.css" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Vazirmatn', sans-serif; background: #0f172a; color: #e2e8f0; line-height: 1.6; overflow-x: hidden; }
        
        /* افکت نویز صنعتی */
        .grain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.05; pointer-events: none; background-image: url('https://grainy-gradients.vercel.app/noise.svg'); }

        .hero { background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), url('https://images.unsplash.com/photo-1581092160607-ee2252250c60?q=80&w=2070'); background-size: cover; height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border-bottom: 3px solid #00d4ff; position: relative; overflow: hidden; }
        
        /* افکت اسکنر هدر */
        .hero::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: #00d4ff; animation: scan 4s linear infinite; box-shadow: 0 0 10px #00d4ff; }
        
        section { padding: 40px 20px; max-width: 800px; margin: auto; animation: fadeInUp 1s ease forwards; }
        
        .card { background: #1e293b; padding: 30px; border-radius: 15px; margin-bottom: 20px; border-left: 5px solid #00d4ff; transition: all 0.3s ease; }
        .card:hover { transform: translateY(-5px); border-left: 5px solid #ff9f43; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

        h1, h2 { color: #00d4ff; margin: 10px 0; }
        .timer { font-size: 2rem; font-weight: bold; color: #00d4ff; text-align: center; margin: 10px 0; }
        
        /* نوار پیشرفت ظرفیت */
        .progress-box { background: #0f172a; height: 20px; border-radius: 10px; margin: 15px 0; overflow: hidden; border: 1px solid #334155; }
        .progress-bar { width: 70%; height: 100%; background: linear-gradient(90deg, #00d4ff, #0077ff); }

        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .btn { background: #00d4ff; color: #000; padding: 15px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; transition: 0.3s; }
        .btn:hover { background: #fff; }

        .spin { display: inline-block; animation: rotation 5s infinite linear; }
        @keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div class="grain"></div>
<div class="hero">
    <h1><span class="spin">⚙️</span> سمینار تاسیسات هوشمند <span class="spin">🔧</span></h1>
    <p>دعوتنامه ویژه استاد پورارجمند</p>
</div>
<section>
    <div class="card">
        <h2>زمان باقی‌مانده <span class="spin">⏳</span></h2>
        <div id="timer" class="timer">--:--:--</div>
    </div>
    
    <!-- بخش سخنران -->
    <div class="card" style="text-align: center;">
        <h2 style="color: #ff9f43;">👤 سخنران ویژه</h2>
        <p><strong>استاد پورارجمند</strong></p>
        <p style="font-size: 0.9rem; opacity: 0.8;">متخصص بهینه‌سازی سیستم‌های تاسیساتی و هوش مصنوعی در پروژه‌های عمرانی</p>
    </div>

    <div class="card">
        <h2>وضعیت ظرفیت</h2>
        <div class="progress-box"><div class="progress-bar"></div></div>
        <p>ظرفیت پر شده: ۷۰٪ (۱۴۲ از ۲۰۰ نفر)</p>
    </div>

    <div class="card">
        <h2>فرم ثبت‌نام</h2>
        <input type="text" placeholder="نام و نام خانوادگی">
        <input type="tel" placeholder="شماره تلفن">
        <button class="btn" onclick="alert('ثبت‌نام با موفقیت انجام شد')">تایید و ثبت نهایی</button>
    </div>
</section>
<script>
    const countDownDate = new Date("Oct 17, 2026 16:00:00").getTime();
    setInterval(function() {
        const now = new Date().getTime();
        const distance = countDownDate - now;
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        document.getElementById("timer").innerHTML = days + " روز " + hours + " ساعت " + minutes + " دقیقه";
    }, 1000);
</script>
</body>
</html>
