<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سمینار هوشمند تاسیسات - پورارجمند</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Variable-font-face.css" rel="stylesheet">
    <style>
        :root { --neon: #00d4ff; --dark: #090e1a; --glass: rgba(255, 255, 255, 0.05); }
        body { margin: 0; font-family: 'Vazirmatn', sans-serif; background: var(--dark); color: #fff; overflow-x: hidden; background-image: radial-gradient(circle at 2px 2px, #1e293b 1px, transparent 0); background-size: 40px 40px; }
        
        /* افکت اسکنر */
        .scanner { position: fixed; top: 0; left: 0; width: 100%; height: 2px; background: var(--neon); box-shadow: 0 0 20px var(--neon); animation: scan 6s linear infinite; z-index: 100; pointer-events: none; }

        .hero { height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: linear-gradient(rgba(9, 14, 26, 0.8), var(--dark)), url('https://images.unsplash.com/photo-1541888946425-d81bb19240f5?q=80&w=2000'); background-size: cover; border-bottom: 2px solid var(--neon); }
        
        .container { max-width: 800px; margin: -50px auto 40px; padding: 20px; }
        
        .card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; margin-bottom: 25px; transition: 0.4s; }
        .card:hover { transform: scale(1.02); border: 1px solid var(--neon); box-shadow: 0 0 30px rgba(0, 212, 255, 0.2); }
        
        .pipe-img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; border: 2px solid #334155; }
        
        .btn { background: var(--neon); color: #000; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
        
        input { background: #090e1a; border: 1px solid #334155; color: white; padding: 15px; width: 100%; margin: 10px 0; border-radius: 8px; box-sizing: border-box; }
        
        h1, h2 { color: var(--neon); text-shadow: 0 0 10px rgba(0,212,255,0.5); }
        
        @keyframes scan { from { top: 0; } to { top: 100%; } }
    </style>
</head>
<body>
<div class="scanner"></div>

<div class="hero">
    <h1>سیستم‌های تاسیساتی هوشمند</h1>
    <p>سمینار تخصصی با حضور استاد پورارجمند</p>
</div>

<div class="container">
    <div class="card">
        <h2>وضعیت سنسورها: در انتظار شروع</h2>
        <div id="timer" style="font-family: monospace; font-size: 2.5rem; color: var(--neon);">--:--:--</div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1621905251189-08b45d6a268e?q=80&w=800" class="pipe-img" alt="اتصالات صنعتی">
        <h2>تحلیل اتصالات پیشرفته</h2>
        <p>در این بخش، ما به بررسی لوله‌های پلیمری با سنسورهای یکپارچه AI می‌پردازیم. مدیریت هوشمند فشار و جریان.</p>
    </div>

    <div class="card">
        <h2>ثبت‌نام در شبکه</h2>
        <input type="text" placeholder="نام مهندس">
        <input type="text" placeholder="کد شناسه شغلی">
        <button class="btn" onclick="alert('داده‌ها در سیستم ثبت شد.')">اتصال به سمینار</button>
    </div>
</div>

<script>
    const target = new Date("Oct 17, 2026 16:00:00").getTime();
    setInterval(() => {
        const now = new Date().getTime();
        const dist = target - now;
        const d = Math.floor(dist / (1000 * 60 * 60 * 24));
        const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
        document.getElementById("timer").innerHTML = `${d}d ${h}h ${m}m`;
    }, 1000);
</script>
</body>
</html>
